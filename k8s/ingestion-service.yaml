apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: snus-project-ingestion-service:latest
          imagePullPolicy: Never
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5001"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: connection-string
            - name: NotificationService__BaseUrl
              value: "http://notification-service:5002"
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /api/reports/sensors
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 5001
      targetPort: 5001