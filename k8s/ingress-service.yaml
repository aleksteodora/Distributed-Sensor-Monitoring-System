apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      labels:
        app: ingress
    spec:
      containers:
        - name: ingress
          image: snus-project-ingress:latest
          imagePullPolicy: Never
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: ReverseProxy__Clusters__ingestion-cluster__Destinations__ingestion__Address
              value: "http://ingestion-service:5001"
            - name: ReverseProxy__Clusters__notification-cluster__Destinations__notification__Address
              value: "http://notification-service:5002"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ingress
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000